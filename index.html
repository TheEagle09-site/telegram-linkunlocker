<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unlock Key</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: Arial, sans-serif;
    }

    .unlock-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .unlock-btn:active {
      transform: scale(0.97);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #1f2937;
      color: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-box h2 {
      margin: 0 0 25px;
      text-align: center;
      font-size: 25px;
    }

    .credential {
      margin-bottom: 18px;
    }

    .credential label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 15px;
      font-weight: bold;
    }

    .copy-row {
      display: flex;
      gap: 8px;
    }

    .value {
      flex: 1;
      min-width: 0;
      padding: 13px;
      background: #111827;
      border-radius: 9px;
      color: white;
      overflow-x: auto;
      white-space: nowrap;
      font-size: 16px;
    }

    .copy-btn {
      border: none;
      border-radius: 9px;
      padding: 0 16px;
      background: #10b981;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #374151;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn:active,
    .copy-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <button class="unlock-btn" onclick="openModal()">
    🔐 Unlock Key
  </button>

  <div class="modal" id="keyModal">

    <div class="modal-box">

      <h2>🔑 Unlock Key</h2>

      <div class="credential">
        <label>Username</label>

        <div class="copy-row">
          <div class="value" id="username">AimAi-2_iUySh</div>

          <button class="copy-btn" onclick="copyText('username')">
            Copy
          </button>
        </div>
      </div>

      <div class="credential">
        <label>Password</label>

        <div class="copy-row">
          <div class="value" id="password">9uoLn5hF</div>

          <button class="copy-btn" onclick="copyText('password')">
            Copy
          </button>
        </div>
      </div>

      <button class="close-btn" onclick="closeModal()">
        Close
      </button>

    </div>

  </div>

  <script>

    function openModal() {
      document.getElementById("keyModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("keyModal").style.display = "none";
    }

    function copyText(id) {

      const text = document.getElementById(id).innerText;

      navigator.clipboard.writeText(text).then(function() {
        alert("Copied!");
      });

    }

    document.getElementById("keyModal").addEventListener("click", function(event) {

      if (event.target === this) {
        closeModal();
      }

    });

  </script>

</body>
</html>
