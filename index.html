<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">

  <title>THE EAGLE⁰⁹ | Unlock Key</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(ellipse at top, #14264a 0%, transparent 55%),
        linear-gradient(145deg, #05070c, #0b1020 60%, #05070c);
    }

    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d7ad54;
      border-radius: 22px;
      background: linear-gradient(145deg, #17284b, #080b14);
      box-shadow: 0 0 30px #1677ff30;
      font-size: 31px;
    }

    .brand {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    .brand span {
      color: #f4c65e;
    }

    .tagline {
      margin-top: 8px;
      color: #9caac3;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .line {
      width: 75px;
      height: 3px;
      margin: 22px auto;
      border-radius: 5px;
      background: linear-gradient(90deg, #188bff, #f4c65e);
    }

    .panel {
      padding: 26px 22px;
      border: 1px solid #263752;
      border-radius: 20px;
      background: #0c1220eF;
      box-shadow: 0 15px 50px #0008;
    }

    .panel h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .panel p {
      color: #9caac3;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 23px;
    }

    .unlock-btn {
      width: 100%;
      padding: 15px;
      border: 1px solid #5caaff;
      border-radius: 11px;
      background: linear-gradient(100deg, #1266d9, #168bff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 22px #168bff35;
      transition: 0.2s;
    }

    .unlock-btn:active,
    .copy-btn:active,
    .close-btn:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 18px;
      color: #8b9bb4;
      font-size: 12px;
    }

    .status span {
      color: #63e6a2;
    }

    .footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: #02040bd9;
      backdrop-filter: blur(8px);
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      padding: 25px 20px;
      border: 1px solid #315078;
      border-radius: 18px;
      background: linear-gradient(150deg, #111d32, #080c16);
      box-shadow: 0 0 40px #1677ff20;
      animation: appear 0.2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-box h2 {
      margin-bottom: 23px;
      text-align: center;
      font-size: 22px;
    }

    .modal-box h2 span {
      color: #f4c65e;
    }

    .credential {
      margin-bottom: 17px;
      text-align: left;
    }

    .credential label {
      display: block;
      margin-bottom: 8px;
      color: #a9bad4;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .copy-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid #293b56;
      border-radius: 10px;
      background: #070b13;
    }

    .value {
      min-width: 0;
      flex: 1;
      padding-left: 5px;
      overflow-wrap: anywhere;
      color: #f4c65e;
      font-size: 14px;
      font-weight: bold;
    }

    .copy-btn {
      padding: 10px 13px;
      border: none;
      border-radius: 7px;
      background: #1677ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #344155;
      border-radius: 9px;
      background: #1a2435;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .toast {
      display: none;
      margin-top: 14px;
      color: #63e6a2;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">🦅</div>

    <h1 class="brand">THE EAGLE<span>⁰⁹</span></h1>

    <p class="tagline">Official Key Center</p>

    <div class="line"></div>

    <section class="panel">
      <h2>🔐 Unlock Your Key</h2>

      <p>
        Welcome to THE EAGLE⁰⁹.<br>
        Open the secure key panel to view your credentials.
      </p>

      <button class="unlock-btn" onclick="openModal()">
        🔑 &nbsp; UNLOCK KEY
      </button>

      <div class="status">
        <span>●</span> Key Panel Available
      </div>
    </section>

    <footer class="footer">
      POWERED BY THE EAGLE⁰⁹
    </footer>

  </main>

  <div class="modal" id="keyModal" role="dialog"
       aria-modal="true" aria-labelledby="modalTitle">

    <div class="modal-box">

      <h2 id="modalTitle">🔑 <span>UNLOCK KEY</span></h2>

      <div class="credential">
        <label for="username">Username</label>

        <div class="copy-row">
          <div class="value" id="username">AimAi-2_Y45Wk</div>

          <button class="copy-btn"
                  onclick="copyText('username')">
            Copy
          </button>
        </div>
      </div>

      <div class="credential">
        <label for="password">Password</label>

        <div class="copy-row">
          <div class="value" id="password">iEJt5AgT</div>

          <button class="copy-btn"
                  onclick="copyText('password')">
            Copy
          </button>
        </div>
      </div>

      <div class="toast" id="toast" role="status"></div>

      <button class="close-btn" onclick="closeModal()">
        ✕ &nbsp; Close Panel
      </button>

    </div>
  </div>

  <script>
    const modal = document.getElementById("keyModal");
    const toast = document.getElementById("toast");

    function openModal() {
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
      toast.style.display = "none";
    }

    function showToast(message) {
      toast.textContent = message;
      toast.style.display = "block";
    }

    async function copyText(id) {
      const value = document.getElementById(id).innerText;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const area = document.createElement("textarea");
          area.value = value;
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();

          const copied = document.execCommand("copy");
          area.remove();

          if (!copied) throw new Error("Copy failed");
        }

        showToast("✓ " + id + " copied successfully!");
      } catch (error) {
        showToast("Copy failed. Please select and copy manually.");
      }
    }

    modal.addEventListener("click", function(event) {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeModal();
    });
  </script>

</body>
</html>
